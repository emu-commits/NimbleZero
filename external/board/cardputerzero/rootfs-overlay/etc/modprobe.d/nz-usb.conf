# The USB controller driver is not loaded automatically: S13nz-usb loads it at boot when
# Options > USB is on (the default), and nz-admin usb on|off switches it at any time.
# With USB off the hub and the USB Ethernet adapter stay unpowered (about 93 mA less,
# measured 2026-11-22).  With the driver built as a module (CONFIG_USB_DWC2=m) the boot
# also skips its 0.7 s controller start; built in, the driver is unbound instead.
blacklist dwc2
